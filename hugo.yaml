baseURL: "https://tm.garcez.xyz/"
languageCode: "en-US"
timeZone: "Europe/Lisbon"
title: "tm . garcez"
theme: "PaperMod"

enableGitInfo: true
enableEmoji: true
enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
pygmentsUseClasses: true

mainsections:
  - "posts"
  - "about"
  - "cv"
  - "projects"

minify:
  disableXML: true
  # minifyOutput: true

pagination:
  disableAliases: false
  pagerSize: 5

defaultContentLanguage: "en"
defaultContentLanguageInSubdir: false
languages:
  en:
    languageName: "English"
    languageCode: "en-US"
    weight: 1
    taxonomies:
      category: "categories"
      tag: "tags"
      series: "series"
    menu:
      main:
        - name: ". about"
          url: "about/"
          weight: 5
        - name: ". career"
          url: "cv/"
          weight: 5
        - name: ". projects"
          url: "projects/"
          weight: 7
        - name: ". archive"
          url: "archives/"
          weight: 10
        - name: ". search"
          url: "search/"
          weight: 10

outputFormats:
  llms:
    mediaType: "text/plain"
    baseName: "llms"
    isPlainText: true
    notAlternative: true

outputs:
  home:
    - "HTML"
    - "RSS"
    - "JSON"
    - "llms"

permalinks:
  posts: "/posts/:year/:month/:slug/"

params:
  env: "production"
  description: "Tiago Pateiro — backend engineer in Lisbon. Agentic AI systems, distributed backends. Writing on AI agents, systems design, and home automation."
  keywords: ["engineering", "software", "blog"]
  author:
    - "tmgarcez"

  DateFormat: "2006-01-02 15:04" # ISO-like: YYYY-MM-DD HH:MM (24h)
  defaultTheme: "auto"
  disableThemeToggle: false
  displayFullLangName: true
  ShowLastMod: true
  ShowShareButtons: false
  ShareButtons:
    - "linkedin"
  ShowReadingTime: true
  ShowBreadCrumbs: true
  ShowPostNavLinks: false
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true

  assets:
    disableHLJS: true
    favicon: "/favicon.svg"
    favicon16x16: "/favicon.svg"
    favicon32x32: "/favicon.svg"
    apple_touch_icon: "/favicon.svg"

  label:
    text: "tm . garcez"
    icon: "/logo.svg"
    iconHeight: 28

  profileMode:
    enabled: true
    title: "hello, I'm Tiago"
    subtitle: "Backend engineer, thirteen years in, at PagerDuty in Lisbon. I work on agentic AI systems and what it takes to run them in production — state, cost, failure modes, evaluation. Here I write about what I'm building: AI agents, home automation, and hands-on notes."
    imageUrl: "/images/me.jpg"
    imageTitle: "tm . garcez"
    imageWidth: 180
    imageHeight: 180
    buttons:
      - name: ". more about me"
        url: "/about/"
      - name: ". my path"
        url: "/cv/"
      - name: ". projects"
        url: "/projects/"
      - name: ". some of my posts"
        url: "/posts/"

  socialIcons:
    - name: "github"
      url: "https://github.com/tmgarcez"
    - name: "linkedin"
      url: "https://www.linkedin.com/in/tmgarcez/"
    - name: "email"
      url: "mailto:contact@garcez.xyz"
    - name: "cv"
      url: "/cv/tmgarcez-cv.pdf"
    - name: "rss"
      url: "/index.xml"

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

sitemap:
  changefreq: "weekly"
  priority: 0.5
