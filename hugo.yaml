baseURL: "https://tm.garcez.xyz/"
languageCode: "en-US"
timeZone: "Europe/Lisbon"
title: "tm . garcez"
theme: "PaperMod"

enableGitInfo: true
enableEmoji: true
enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
pygmentsUseClasses: true

mainsections:
  - "posts"
  - "about"
  - "cv"
  - "projects"

minify:
  disableXML: true
  # minifyOutput: true

pagination:
  disableAliases: false
  pagerSize: 5

defaultContentLanguage: "en"
defaultContentLanguageInSubdir: false
languages:
  en:
    languageName: "English"
    languageCode: "en-US"
    weight: 1
    taxonomies:
      category: "categories"
      tag: "tags"
      series: "series"
    menu:
      main:
        - name: ". about"
          url: "about/"
          weight: 5
        - name: ". career"
          url: "cv/"
          weight: 10
        - name: ". posts"
          url: "posts/"
          weight: 15

outputFormats:
  llms:
    mediaType: "text/plain"
    baseName: "llms"
    isPlainText: true
    notAlternative: true

outputs:
  home:
    - "HTML"
    - "RSS"
    - "JSON"
    - "llms"

permalinks:
  posts: "/posts/:year/:month/:slug/"

params:
  env: "production"
  description: "Tiago Pateiro, senior software engineer at PagerDuty in Lisbon. Distributed systems, backend engineering, and LLM-based agents for incident response."
  keywords: ["engineering", "software", "blog"]
  author:
    - "tmgarcez"

  DateFormat: "2006-01-02 15:04" # ISO-like: YYYY-MM-DD HH:MM (24h)
  defaultTheme: "auto"
  disableThemeToggle: false
  displayFullLangName: true
  ShowLastMod: true
  ShowShareButtons: false
  ShareButtons:
    - "linkedin"
  ShowReadingTime: true
  ShowBreadCrumbs: true
  ShowPostNavLinks: false
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true

  assets:
    disableHLJS: true
    favicon: "/favicon.svg"
    favicon16x16: "/favicon.svg"
    favicon32x32: "/favicon.svg"
    apple_touch_icon: "/favicon.svg"

  label:
    text: "tm . garcez"
    icon: "/logo.svg"
    iconHeight: 28

  profileMode:
    enabled: true
    title: "hello, I'm Tiago"
    subtitle: "Senior software engineer at PagerDuty in Lisbon, with 13+ years of experience. I build distributed systems and work on LLM-based agents for incident response."
    imageUrl: "/images/me.jpg"
    imageTitle: "tm . garcez"
    imageWidth: 180
    imageHeight: 180
    buttons:
      - name: ". about"
        url: "/about/"
      - name: ". career"
        url: "/cv/"

  socialIcons:
    - name: "github"
      url: "https://github.com/tmgarcez"
    - name: "linkedin"
      url: "https://www.linkedin.com/in/tmgarcez/"
    - name: "email"
      url: "mailto:contact@garcez.xyz"
    - name: "cv"
      url: "/cv/tmgarcez-cv.pdf"
    - name: "rss"
      url: "/index.xml"

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

sitemap:
  changefreq: "weekly"
  priority: 0.5
